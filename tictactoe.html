<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="tictactoe.css"/>

</head>

<body>
    <div>
        <h2>Welcome to Tic Tac Toe Game</h2>
        <div class="board">
            <div class="row-1">
                <div class="cell" id="index-1"></div>
                <div class="cell" id="index-2"></div>
                <div class="cell" id="index-3"></div>
            </div>
             <div class="row-2">
                <div class="cell" id="index-4"></div>
                <div class="cell" id="index-5"></div>
                <div class="cell" id="index-6"></div>
            </div>
             <div class="row-3">
                <div class="cell" id="index-7"></div>
                <div class="cell" id="index-8"></div>
                <div class="cell" id="index-9"> </div>
            </div>
        </div>
        <p id="message"></p>
    </div>
</body>
<script src="tictactoe.js"></script>

</html>
